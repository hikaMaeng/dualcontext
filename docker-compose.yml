name: dualcontext

services:
  dualcontext:
    build:
      context: .
      dockerfile: apps/dualcontext/docker/Dockerfile
    image: dualcontext-root-dualcontext:latest
    container_name: dualcontext
    # Reap zombies and forward signals, so stopping the stack is immediate
    # instead of waiting out the kill timeout.
    init: true
    restart: unless-stopped
    env_file:
      # Generated from docker/env.defaults and never committed. The image
      # carries its own defaults, so a missing file is not fatal.
      - path: apps/dualcontext/docker/.env
        required: false
    ports:
      # Loopback only: the admin site has no authentication yet.
      - "127.0.0.1:${DUALCONTEXT_HOST_PORT:-18081}:18081"
    extra_hosts:
      # Lets the container reach AI servers running on the host (Docker Desktop
      # defines this name already; Linux needs the mapping).
      - "host.docker.internal:host-gateway"
    volumes:
      # The only volume. Each persisted concern is a subfolder of it
      # (pgdata/ today); do not add a second volume. The target is the path the
      # base image declares as VOLUME, so no anonymous volume is created.
      - dualcontext_data:/var/lib/postgresql/data
      # Read-only view of host source trees for "codebase" researchers with a directory source
      # (path "workspace/<project>"). A bind mount, not a volume: nothing is written to it. Set
      # DUALCONTEXT_WORKSPACE_DIR in the git-ignored root .env; unset, it is an empty folder.
      - type: bind
        source: ${DUALCONTEXT_WORKSPACE_DIR:-./.docker/workspace}
        target: /var/lib/postgresql/data/workspace
        read_only: true
        bind:
          create_host_path: true
    networks:
      - dualcontext_internal

  # Headless-browser crawler for the "crawler" researcher type. Stateless: no volume (the crawl
  # cache lives in dualcontext's database). Reached by dualcontext as http://crawler:11235 on the
  # project network; it publishes no host port.
  crawler:
    build:
      context: .
      dockerfile: apps/crawler/docker/Dockerfile
    image: dualcontext-root-crawler:latest
    container_name: crawler
    init: true
    restart: unless-stopped
    env_file:
      - path: apps/crawler/docker/.env
        required: false
    # No host port: only dualcontext reaches it, over the project network. deploy verifies
    # health from inside the container, using the port declared here.
    expose:
      - "11235"
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: "1gb"
    mem_limit: 3g
    networks:
      - dualcontext_internal

volumes:
  dualcontext_data:

networks:
  # Project-scoped: no other compose project joins this network. Publishing a
  # port to the host is how the outside reaches the service.
  dualcontext_internal:
    internal: false
